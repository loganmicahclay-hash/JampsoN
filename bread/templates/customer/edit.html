{% extends "base.html" %}

{% block body %}

<div class="row">
    <div class="col-12 offset-1 mt-4">
        <h2>Edit Customer</h2>
    </div>
</div>

<div class="row">
    <div class="col-md-8 mx-auto mt-4">

        <form method="POST">

            <div class="mb-3">
                <label for="fname" class="form-label">
                    First Name
                </label>
                <input
                    type="text"
                    class="form-control"
                    id="fname"
                    name="fname"
                    value="{{ user.fname }}"
                    required>
            </div>

            <div class="mb-3">
                <label for="lname" class="form-label">
                    Last Name
                </label>
                <input
                    type="text"
                    class="form-control"
                    id="lname"
                    name="lname"
                    value="{{ user.lname }}"
                    required>
            </div>

            <div class="mb-3">
                <label for="company_name" class="form-label">
                    Company Name
                </label>
                <input
                    type="text"
                    class="form-control"
                    id="company_name"
                    name="company_name"
                    value="{{ user.company_name }}">
            </div>

            <div class="mb-3">
                <label for="address" class="form-label">
                    Address
                </label>
                <input
                    type="text"
                    class="form-control"
                    id="address"
                    name="address"
                    value="{{ user.address }}"
                    required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">
                    Email
                </label>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    value="{{ user.email }}"
                    required>
            </div>

            <div class="mb-3">
                <label for="phone_number" class="form-label">
                    Phone Number
                </label>
                <input
                    type="tel"
                    class="form-control"
                    id="phone_number"
                    name="phone_number"
                    value="{{ user.phone_number }}"
                    required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    New Password
                </label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password">

                <div class="form-text">
                    Leave blank to keep the current password.
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

                <a href="{{ url_for('customer.customers') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</div>

{% endblock %}
