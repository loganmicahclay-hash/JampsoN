{% extends "base.html" %}

{% block body %}

<div class="container mt-3">
    <div class="row">
        <div class="col-12">
            <h2>Add New Crate</h2>
        </div>
    </div>

    <div class="row">
        <div class="col-6">
            <form method="post" action="{{ url_for('inventory.save') }}">

                <div class="form-group">
                    <div class="mb-3">
                        <label for="fruit" class="form-label">Fruit</label>

                        <select name="fruit" id="fruit" class="form-select" required>
                            <option value="" selected disabled>Choose a fruit</option>
                            <option value="Apple">Apple</option>
                            <option value="Banana">Banana</option>
                            <option value="Orange">Orange</option>
                            <option value="Strawberry">Strawberry</option>
                            <option value="Grape">Grape</option>
                            <option value="Watermelon">Watermelon</option>
                            <option value="Pineapple">Pineapple</option>
                            <option value="Mango">Mango</option>
                            <option value="Pear">Pear</option>
                            <option value="Peach">Peach</option>
                        </select>
                    </div>
                </div>

                <div class="form-group mt-3">
                    <label for="stock">Stock</label>
                    <input type="number" class="form-control" id="stock" name="stock" placeholder="Enter amount"
                        autocomplete="off" required>
                </div>

                <div class="form-group mt-3">
                    <label for="price">Price ($)</label>
                    <input type="number" class="form-control" id="price" name="price" step="0.01" min="0"
                        placeholder="Enter price" autocomplete="off" required>
                </div>

                <div class="form-group mt-3">
                    <label for="expiration">Expiration Date and Time</label>

                    <input id="expiration" name="expiration" type="datetime-local" class="form-control"
                        min="{{ min_expiration }}" required>
                </div>

                <div class="form-group mt-3">
                    <label for="location">Location</label>
                    <input type="text" class="form-control" id="location" name="location" placeholder="Enter location"
                        autocomplete="off" required>
                </div>

                <div class="d-flex align-items-center gap-4 mt-3">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{{ url_for('inventory.browse') }}" class="btn btn-secondary">Cancel</a>
                </div>

            </form>
        </div>
    </div>
</div>

{% endblock %}
