{% extends "base.html" %}

{% block body %}

<div class="container mt-3">
    <div class="row">
        <div class="col-12">
            <h2>Edit ({{ inventory.fruit }}) from ({{ inventory.location }})</h2>
        </div>
    </div>

    <div class="row">
        <div class="col-6">
            <form method="post" action="{{ url_for('inventory.update', inventory_id=inventory.id) }}">
                <div class="form-group">
                    <div class="mb-3">
                        <label for="fruit" class="form-label">Fruit</label>

                        <select name="fruit" id="fruit" class="form-select" required>
                            <option value="" disabled>Choose a fruit</option>

                            <option value="Apple" {% if inventory.fruit=="Apple" %}selected{% endif %}>
                                Apple
                            </option>

                            <option value="Banana" {% if inventory.fruit=="Banana" %}selected{% endif %}>
                                Banana
                            </option>

                            <option value="Orange" {% if inventory.fruit=="Orange" %}selected{% endif %}>
                                Orange
                            </option>

                            <option value="Strawberry" {% if inventory.fruit=="Strawberry" %}selected{% endif %}>
                                Strawberry
                            </option>

                            <option value="Grape" {% if inventory.fruit=="Grape" %}selected{% endif %}>
                                Grape
                            </option>

                            <option value="Watermelon" {% if inventory.fruit=="Watermelon" %}selected{% endif %}>
                                Watermelon
                            </option>

                            <option value="Pineapple" {% if inventory.fruit=="Pineapple" %}selected{% endif %}>
                                Pineapple
                            </option>

                            <option value="Mango" {% if inventory.fruit=="Mango" %}selected{% endif %}>
                                Mango
                            </option>

                            <option value="Pear" {% if inventory.fruit=="Pear" %}selected{% endif %}>
                                Pear
                            </option>

                            <option value="Peach" {% if inventory.fruit=="Peach" %}selected{% endif %}>
                                Peach
                            </option>
                        </select>
                    </div>
                </div>

                <div class="form-group mt-3">
                    <label for="stock">Stock</label>
                    <input type="number" class="form-control" id="stock" name="stock" placeholder="Enter amount"
                        autocomplete="off" value="{{ inventory.stock }}">
                </div>

                <div class="form-group mt-3">
                    <label for="price">Price ($)</label>
                    <input type="number" class="form-control" id="price" name="price" step="0.01" min="0"
                        placeholder="Enter price" autocomplete="off" value="{{ inventory.price }}">
                </div>

                <div class="form-group mt-3">
                    <label for="expiration">Expiration Date and Time</label>

                    <input id="expiration" name="expiration" type="datetime-local" class="form-control"
                        min="{{ min_expiration }}" value="{{ inventory.expiration.strftime('%Y-%m-%dT%H:%M') }}"
                        required>
                </div>

                <div class="form-group mt-3">
                    <label for="location">Location</label>
                    <input type="text" class="form-control" id="location" name="location" placeholder=""
                        autocomplete="off" value="{{ inventory.location }}">
                </div>

                <div class="d-flex align-items-center gap-4 mt-2">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('inventory.browse') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
