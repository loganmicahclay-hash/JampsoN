{% extends "base.html" %}

{% block body %}

<div class="row">


<div class="col-sm-4 offset-sm-4 col-xs-12 p-3">

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-warning" role="alert">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <h1>Sign In</h1>

    <form action="{{ url_for('site.login_post') }}" method="POST">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                id="email"
                name="email"
                type="email"
                class="form-control"
                placeholder="Enter email"
                autocomplete="email"
                required
            >

        </div>


        <div class="form-group mt-3">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                class="form-control"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

        </div>


        <div class="form-group mt-3">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Sign In
            </button>

        </div>

    </form>


    <div class="mt-3">

        <p>
            Don't have an account?
            <a href="{{ url_for('site.signup') }}">
                Sign Up
            </a>
        </p>

    </div>

</div>

</div>

{% endblock %}
