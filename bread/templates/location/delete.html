{% extends "base.html" %}

{% block body %}

<div class="container mt-4">

    <div class="row">
        <div class="col-12">
            <h2>Delete Location</h2>

            <p class="mt-4">
                Are you sure you want to delete this location?
            </p>

            <div class="card mt-3">
                <div class="card-body">
                    <h5 class="card-title">{{ location.name }}</h5>

                    <p class="card-text">
                        <strong>Address:</strong> {{ location.address }}
                    </p>

                    <p class="card-text">
                        <strong>Employees:</strong> {{ location.employees }}
                    </p>
                </div>
            </div>

            <div class="mt-4">
                <form method="POST"
                      action="{{ url_for('location.delete_confirm', location_id=location.id) }}"
                      style="display: inline;">

                    <button type="submit" class="btn btn-danger">
                        Yes, Delete Location
                    </button>

                </form>

                <a href="{{ url_for('location.browse') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </div>

        </div>
    </div>

</div>

{% endblock %}
